# v1.1 Removing request text, added bg image. added power meter reading.
# avoid screen swap when Voice assistant, or timer is active.
# Response and shopping list scroll when content is longer than it's label size
# v1.2 touch integrated with spd2010_glue component
# v1.3 migrated to the new mipi spi display setting, modified init sequence as per https://components.espressif.com/components/espressif/esp_lcd_spd2010/versions/2.0.0~1/readme?language=en
#todo: gyroscope: https://github.com/dala318/esphome-qmi8658/blob/main/led8x8-qmi8658.yaml
#media_player.xiao_ai_yin_xiang_9318
---
substitutions:
  #bg_img: /config/esphome/images/default/waveshare_bg_tp420.jpg
  bg_img: "https://raw.githubusercontent.com/chickymonkey/waveshare-lcd-1.46-touch/refs/heads/main/waveshare_bg_tp420.jpg"
  music_bg_img: "https://raw.githubusercontent.com/chickymonkey/waveshare-lcd-1.46-touch/refs/heads/main/music_bg_412.png"
  wifi_name: "Waveshare-146-Va"
  left_sensor: "sensor.powerpal_real_time_power"
  dishwasher_price_sensor: "sensor.finish_dishwashing_tablets_56_pack"
  right_switch: "light.tv_floor_lamp"
  #media player in home assistant
  external_media_player: "living_room_speaker"
  
esphome:
  name: waveshare-146-va
  friendly_name: waveshare 146 va 1.2
  on_boot:
    - priority: 600
      then:
        - delay: 15s
        - script.execute: draw_display
        - media_player.speaker.play_on_device_media_file:
            media_file: timer_finished_sound
            announcement: true

    - priority: -100
      #initialize the touch driver
      then:
        - delay: 300ms
        - lambda: |-
            id(touch_glue).begin();
        
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    components: 
      - name: espressif/esp_lcd_touch_spd2010
        ref: 2.0.0
      - name: espressif/esp_lcd_touch
        ref: 1.2.1
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
#      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
#      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5
    advanced:
      execute_from_psram: true
      compiler_optimization: "PERF"
logger:
  level: DEBUG
  logs:
    text_sensor: INFO
    sensor: WARN
    component: WARN
    select: INFO
    light: INFO
    lvgl: INFO
    display: WARN
    speaker: WARN
    microphone: DEBUG
    audio: DEBUG
    micro_wake_word: DEBUG
    voice_assistant: DEBUG
    media_player: WARN
    spd2010_glue: WARN
api:
  encryption:
    key: "/NRi8kWEuodQFhY40a8yvujDUELH0yhZIOTECv81wU0="
  on_client_connected:
    then:
      - delay: 1.5s
      - script.execute: update_timer_progress_arc
      - script.execute: draw_display
#used to check free ram, cpu.
debug:
  update_interval: 60s

ota:
  - platform: esphome
    password: "1554a3a8fd1fa8d97307d74f21aa9fde"

    on_begin:
      - logger.log:
          level: INFO
          tag: ota
          format: "OTA begin: loop watchdog suspended, pausing full audio runtime and LVGL"
      - globals.set:
          id: g_ota_in_progress
          value: "true"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  ap:
    ssid: "Waveshare-146-Va"
    password: "wifi12345"

captive_portal:

external_components:
  - source: components

time:
  - platform: homeassistant
    on_time:
      - hours: 1,2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 1,2,3,4,5
        minutes: 50
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn

interval:
  - interval: 30s
    then:
      - script.execute: check_dim

network:
  enable_high_performance: false
psram:
  mode: octal
  speed: 80MHz

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO38
    i2s_bclk_pin:
      number: GPIO48
    
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO2
    i2s_bclk_pin:
      number: GPIO15

microphone:
  - platform: i2s_audio
    id: i2s_microphone
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    channel: right
    sample_rate: 16000
    bits_per_sample: 32bit #changed from 16bit to 32, aligning with the driver in the demo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO47
    dac_type: external
    channel: mono
    buffer_duration: 600ms #default 500ms
    

media_player:
  - platform: speaker
    id: speaker_media_player
    name: None
    volume_min: 0.6
    volume_max: 1
    volume_initial: 0.9
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: i2s_audio_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      
    # Pause wake word during announcements, then redraw
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - script.execute: stop_wake_word
            # Ensure VA stops before moving on
            - if:
                condition:
                  - lambda: return id(wake_word_engine_location).state == "In Home Assistant";
                then:
                  - wait_until:
                      - not:
                          voice_assistant.is_running:
      # Since VA isn't running, this is user-intiated media playback. Draw the mute display
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - lambda: id(voice_assistant_phase) = id(voice_assist_listening_phase_id);
            - script.execute: draw_display
    on_idle:
      # Restart wake word after announcement finishes
      - delay: 150ms
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display

micro_wake_word:
  id: mww
  models:
    - hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: i2s_microphone
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 0
  auto_gain: 31dBFS
  volume_multiplier: 3.5
  # Screen hooks (update response + phases)
  on_listening:
    - logger.log: "VA: listening for command"
    - lambda: id(voice_assistant_phase) = id(voice_assist_listening_phase_id);

    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display
    # Make the arc visible and set it to full ring during listening
    - lvgl.widget.update:
        id: timer_progress_arc
        hidden: false
    - light.turn_on:
        id: screen_backlight
        brightness: 80%
    #listening effect for listening status.
    - lambda: |-
        id(va_listening_glow) = true;
    - lvgl.widget.update:
        id: va_phase_label
        text_opa: 100%
    - script.execute: update_timer_progress_arc
    - lambda: 'id(last_active_ms) = millis();'
  on_stt_vad_start:
    - logger.log: "VA: VAD detected speech start"
  on_stt_vad_end:
    - logger.log: "VA: VAD detected speech end"
    - lambda: id(voice_assistant_phase) = id(voice_assist_thinking_phase_id);
    - script.execute: draw_display
    - lambda: 'id(va_listening_glow) = false;'
    - script.execute: update_timer_progress_arc
  on_tts_start:
    - lambda: id(voice_assistant_phase) = id(voice_assist_replying_phase_id);
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lvgl.label.update:
        id: va_response_label
        text: !lambda return id(text_response).state.c_str();
        text_opa: 100%
    - lambda: 'id(last_active_ms) = millis();'
    - lvgl.widget.update:
        id: timer_progress_arc
        hidden: true
    - lambda: 'id(va_listening_glow) = false;'
    - script.execute: update_timer_progress_arc
    - script.execute: draw_display

  on_end:
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 1.5s
    
    - lambda: 'id(last_active_ms) = millis();'

    - wait_until:
        condition:
          and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - if:
        condition:
          lambda: return id(wake_word_engine_location).state == "On device";
        then:
          - lambda: id(va).set_use_wake_word(false);
          - script.execute: start_wake_word

    - script.execute: set_idle_or_mute_phase

    - lvgl.widget.update:
        id: timer_progress_arc
        hidden: true
    - script.execute: draw_display
    
  # End of On_end  
  on_error:
    - lambda: id(voice_assistant_phase) = id(voice_assist_error_phase_id);
    - lambda: 'id(va_listening_glow) = false;'
    - script.execute: draw_display
    - delay: 1s
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    - script.execute: update_timer_progress_arc
    - lvgl.widget.update:
        id: timer_progress_arc
        hidden: true

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display

  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = id(voice_assist_not_ready_phase_id);
    - script.execute: draw_display

  # Optional: timer hooks (if you plan to surface timers on LVGL)
  on_timer_started:
    - script.execute: update_timer_progress_arc
    - script.execute: draw_display
    - light.turn_on:
        id: screen_backlight
        brightness: 80%
    - lvgl.widget.update:
        id: timer_progress_arc
        hidden: false
  on_timer_cancelled:
    - script.execute: update_timer_progress_arc
    - script.execute: draw_display
    - lvgl.widget.update:
        id: timer_progress_arc
        hidden: true
  on_timer_updated:
    - script.execute: update_timer_progress_arc
    - script.execute: draw_display
  on_timer_tick:
    - script.execute: update_timer_progress_arc
    - script.execute: draw_display
    - text_sensor.template.publish: { id: text_response, state: "" }
  on_timer_finished:
    - script.execute: update_timer_progress_arc
    - switch.turn_on: timer_ringing
    - lambda: id(voice_assistant_phase) = id(voice_assist_timer_finished_phase_id);
    - lvgl.widget.update:
        id: timer_progress_arc
        hidden: true
    - light.turn_on:
        id: screen_backlight
        brightness: 80%
    - script.execute: draw_display
button:
  - platform: restart
    name: "Kitchen ESP Reset"
# -----------------------------------------------------------------------------
# MUTE SWITCH (software mute)
switch:
  - platform: template
    name: Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_off:
      - microphone.unmute:
      - script.execute: set_idle_or_mute_phase
      - script.execute: draw_display
    on_turn_on:
      - microphone.mute:
      - script.execute: set_idle_or_mute_phase
      - script.execute: draw_display

  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      #- logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      #- logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      # Turn off the repeat mode and disable the pause between playlist items
      - lambda: |-
              id(speaker_media_player)
                ->make_call()
                .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
                .set_announcement(true)
                .perform();
              id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);
      # Stop playing the alarm
      - media_player.stop:
          announcement: true
    on_turn_on:
      # Turn on the repeat mode and pause for 1000 ms between playlist items/repeats
      - lambda: |-
            id(speaker_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(speaker_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 1000);
      #make sure volume is not too small for alarm.
      - speaker.volume_set:
          id: i2s_audio_speaker
          volume: 95%

      - media_player.speaker.play_on_device_media_file:
          media_file: timer_finished_sound
          announcement: true
      ##play for 20 seconds.
      - delay: 22s
      - switch.turn_off: timer_ringing
# -----------------------------------------------------------------------------
# SELECT → choose wake word engine location (device vs HA streaming)
select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: On device

    on_value:
      # Wait until VA is either Muted or Idle before switching engines
      - wait_until:
          condition:
            lambda: return id(voice_assistant_phase) == id(voice_assist_muted_phase_id) ||
                            id(voice_assistant_phase) == id(voice_assist_idle_phase_id);

      # Switch to HA streaming wake word
      - if:
          condition:
            lambda: return x == "In Home Assistant";
          then:
            - micro_wake_word.stop
            - delay: 500ms
            - if:
                condition:
                  switch.is_off: mute
                then:
                  - lambda: id(va).set_use_wake_word(true);
                  - voice_assistant.start_continuous:

      # Switch to on-device micro wake word
      - if:
          condition:
            lambda: return x == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop
            - delay: 500ms
            - if:
                condition:
                  switch.is_off: mute
                then:
                  - micro_wake_word.start

# -----------------------------------------------------------------------------
# SCRIPTS → start/stop wake word + phase helper
script:
  - id: start_wake_word
    then:
      # MWW owns the microphone consumer and starts the AFE/I2S path. Do not
      # start it from early boot or generic API callbacks; wait for init to
      # clear and make every caller pass through this single gate.
      - wait_until:
          condition:
            lambda: 'return millis() >= 10000;'
          timeout: 10s
      - delay: 2s
      - if:
          condition:
            and:
              # run only if none met: initializing, ota in progress, wake word not enabled, mute,
              #va running, wake word running, media player announcing, ww is on device.
              - lambda: 'return !id(init_in_progress);'
              - lambda: 'return !id(g_ota_in_progress);'
              - switch.is_off: mute
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
              - not:
                  media_player.is_announcing:
                    id: speaker_media_player
              - lambda: return id(wake_word_engine_location).state == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
            - delay: 1s
            - lambda: |-
                TaskHandle_t mww_task = xTaskGetHandle("mww");
                if (mww_task) {
                  vTaskPrioritySet(mww_task, 8);
                }
            - logger.log:
                tag: mww
                format: "MWW: safe start"
          else:
            - logger.log:
                level: INFO
                tag: mww
                format: "MWW: safe start skipped init=%d ota=%d mute=%d va=%d mww=%d announcing=%d"
                args:
                  - id(init_in_progress)
                  - id(g_ota_in_progress)
                  - id(mute).state
                  - id(va).is_running()
                  - id(mww).is_running()
                  - id(speaker_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING
      - if:
          condition:
            and:
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).state == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous: # continuous wake word only supported when wake word is "In Home Assistant"

  # Stops either micro wake word or streaming wake word
  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).state == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).state == "On device";
          then:
            - micro_wake_word.stop:

  # Set phase to idle/muted depending on software mute
  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = id(voice_assist_idle_phase_id);
          else:
            - lambda: id(voice_assistant_phase) = id(voice_assist_muted_phase_id);

  - id: draw_display
    then:
      # If still initializing, just show that
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lvgl.label.update:
                id: va_phase_label
                text: "Initializing..."
            - lvgl.label.update:
                id: va_status_label
                text: ""
            - lvgl.label.update:
                id: va_response_label
                text: ""
            - script.execute: lvgl_apply_mute_style_if_needed
            - lvgl.widget.redraw: va_phase_label
            - lvgl.widget.redraw: va_status_label
            - lvgl.widget.redraw: va_response_label
            

      # Not initializing: check connectivity and update accordingly
      - if:
          condition:
            wifi.connected:
          then:
            - if:
                condition:
                  api.connected:
                then:
                  # Connected to HA: show phase + last response
                  - lvgl.label.update:
                      id: va_phase_label
                      text: !lambda |-
                        switch (id(voice_assistant_phase)) {
                          case 1:  return "Idle - 'HEY JARVIS'";
                          case 2:  return "Listening...";
                          case 3:  return "Thinking...";
                          case 4:  return "Replying...";
                          case 10: return "Not ready";
                          case 11: return "Error";
                          case 12: return "Muted";
                          case 20: return "Timer finished";
                          default: return "Idle - 'HEY JARVIS'";
                        }
        
                  - lvgl.label.update:
                      id: va_response_label
                      text: !lambda return id(text_response).state.c_str();
                      text_color: white
                  - lvgl.label.update:
                      id: va_status_label
                      # Wifi Good, HA good
                      text: "\U000F16BD \U000F07D1"
                      text_font: roboto_icons_25
                      text_color: green
                  - script.execute: lvgl_apply_mute_style_if_needed
                  - lvgl.widget.redraw: va_phase_label
                  - lvgl.widget.redraw: va_response_label
                  - lvgl.widget.redraw: va_status_label
                  - lvgl.widget.redraw: timer_progress_arc
                  - lvgl.widget.redraw: timer_progress_text
                else:
                  # No HA: show status; clear response
                  - lvgl.label.update:
                      id: va_phase_label
                      text: "No HA"
                  - lvgl.label.update: { id: va_response_label, text: "Connect to wifi name ${wifi_name}, and reconnect to your home wifi" }
                  - lvgl.label.update:
                      id: va_status_label
                      # Wifi Good, No HA
                      text: "\U000F16BD \U000F1A35"
                      text_font: roboto_icons_25
                      text_color: red
                  - script.execute: lvgl_apply_mute_style_if_needed
                  - lvgl.widget.redraw: va_phase_label
                  - lvgl.widget.redraw: va_response_label
                  - lvgl.widget.redraw: va_status_label
                  - lvgl.widget.redraw: timer_progress_arc
                  - lvgl.widget.redraw: timer_progress_text
          else:
            # No Wi‑Fi: show status; clear response
            - lvgl.label.update:
                id: va_phase_label
                text: "\U000F16BC"
                text_font: roboto_icons_25
            - lvgl.label.update: { id: va_response_label, text: "" }
            - script.execute: lvgl_apply_mute_style_if_needed
            - lvgl.widget.redraw: va_phase_label
            - lvgl.widget.redraw: va_response_label
            - lvgl.widget.redraw: va_status_label
            - lvgl.widget.redraw: timer_progress_arc
            - lvgl.widget.redraw: timer_progress_text

  # Helper: apply muted style dimming when the Mute switch is ON
  - id: lvgl_apply_mute_style_if_needed
    then:
      - if:
          condition:
            switch.is_on: mute
          then:
            # Apply a dimmed look when muted
            - lvgl.widget.update:
                id: va_phase_label
                text_color: red  
            - lvgl.widget.update:
                id: va_response_label
                text_color: 0xFFFFFF

          else:
            # Restore normal look when unmuted (adjust to your theme)
            - lvgl.widget.update:
                id: va_phase_label
                text_color: yellow

            - lvgl.widget.update:
                id: va_response_label
                text_color: 0xFFFFFF

  - id: listening_arc_pulse
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(va_listening_glow);'
          then:
            # Step 1 — 100% (COVER)
            - lvgl.arc.update:
                id: timer_progress_arc
                value: 100
                bg_opa: transp
                bg_color: 0xFFFFFF 
                indicator:
                  opa: COVER
                  arc_color: blue

            - delay: 250ms

            # Step 2 — 75%
            - lvgl.arc.update:
                id: timer_progress_arc
                value: 100
                indicator:
                  opa: COVER
                  arc_color: green
            - delay: 250ms
            - lvgl.arc.update:
                id: timer_progress_arc
                value: 100
                indicator:
                  opa: 50%
                  arc_color: red
            - delay: 250ms

            - lvgl.arc.update:
                id: timer_progress_arc
                value: 100
                indicator:
                  opa: COVER
                  arc_color: yellow
            - delay: 250ms

  - id: update_timer_progress_arc
    then:
      - lambda: |-
          // Get all timers (now std::vector<Timer> since ESPHome 2026.2)
          const auto &timers = id(va).get_timers();
          bool has_any = !timers.empty();

          // Choose the soonest ACTIVE timer; else the soonest overall
          bool has_active = false;
          voice_assistant::Timer chosen = has_any ? timers.front() : voice_assistant::Timer{};
          if (has_any) {
            for (const auto &t : timers) {
              if (t.is_active) {
                if (!has_active || t.seconds_left <= chosen.seconds_left) {
                  chosen = t;
                }
                has_active = true;
              }
            }
            if (!has_active) {
              for (const auto &t : timers) {
                if (t.seconds_left <= chosen.seconds_left) {
                  chosen = t;
                }
              }
            }
          }

          // Compute percentage remaining (0..100), clamp
          int pct = 0;
          if (has_any) {
            const uint32_t total = chosen.total_seconds > 0 ? chosen.total_seconds : 1;
            pct = (int) roundf(100.0f * (float) chosen.seconds_left / (float) total);
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
          }

          // Store results for later updates
          id(timer_progress_percent) = pct;
          id(timer_progress_has_timer) = has_any;
          id(timer_progress_seconds_left) = has_any ? (int) chosen.seconds_left : 0;

      
      - if:
          condition:
            lambda: 'return id(va_listening_glow);'
          then:
            - lvgl.widget.update:
                id: timer_progress_arc
                hidden: false
            - script.execute: listening_arc_pulse
          else:
            # Not listening: normal timer behavior
            - script.stop: listening_arc_pulse
            - if:
                condition:
                  #lambda: 'return id(timer_progress_has_timer);'
                  lambda: |-
                          return id(timer_progress_has_timer) && (id(timer_progress_seconds_left) > 0);

                then:
                  - lvgl.arc.update:
                      id: timer_progress_arc
                      hidden: false
                      bg_opa: transp
                      indicator:
                        bg_color: green
                        opa: COVER
                  - lvgl.arc.update:
                      id: timer_progress_arc
                      value: !lambda 'return id(timer_progress_percent);'
                  
                  # Update the center label text: HH:MM:SS if >=1h, else MM:SS
                  - lvgl.label.update:
                      id: timer_progress_text
                      text: !lambda |-
                        int sec = id(timer_progress_seconds_left);
                        char buf[16];
                        if (sec >= 3600) {
                          int h = sec / 3600;
                          int m = (sec % 3600) / 60;
                          int s = sec % 60;
                          snprintf(buf, sizeof(buf), "%d:%02d:%02d", h, m, s);
                        } else {
                          int m = sec / 60;
                          int s = sec % 60;
                          snprintf(buf, sizeof(buf), "%02d:%02d", m, s);
                        }
                        return std::string(buf);

                  - lvgl.widget.update:
                      id: timer_progress_text
                      hidden: false
                else:
                  - lvgl.widget.update:
                      id: timer_progress_arc
                      hidden: true
                  - lvgl.arc.update:
                      id: timer_progress_arc
                      value: 0
                  - lvgl.widget.update:
                      id: timer_progress_text
                      hidden: true

  - id: my_media_pause
    then:
      - homeassistant.action:
          action: media_player.media_pause
          data:
            entity_id: media_player.${external_media_player}
      - delay: 50ms
  - id: my_media_play
    then:
      - homeassistant.action:
          action: media_player.media_play
          data:
            entity_id: media_player.${external_media_player}
      - delay: 50ms
  - id: my_media_prev
    then:
      - homeassistant.action:
          action: media_player.media_previous_track
          data:
            entity_id: media_player.${external_media_player}
      - delay: 50ms
  - id: my_media_next
    then:
      - homeassistant.action:
          action: media_player.media_next_track
          data:
            entity_id: media_player.${external_media_player}
      - delay: 50ms

  - id: check_dim
    #dim after 2 min idle or change to home page after 30 second idle
    mode: queued
    then:
      - if:
          condition:
            and:
              - lambda: 'return (millis() - id(last_active_ms)) > 120000;'
              - lambda: |-
                  const auto &timers = id(va).get_timers();
                  for (const auto &t : timers) {
                    if (t.is_active && t.seconds_left > 0) return false;
                  }
                  return true;
                
              - lambda: |-
                  const float b = id(screen_backlight).current_values.get_brightness();
                  return fabsf(b - 0.40f) > 0.02f;
          then:
            - light.turn_on:
                id: screen_backlight
                brightness: 40%
            #- logger.log: "DIMMER: All conditions met → setting brightness=40%"
          else:
            #- logger.log: "DIMMER: Not conditions met"
      - if:
          condition:
            and:
              - lambda: 'return (millis() - id(last_active_ms)) > 30000;'
          then:
            - lvgl.page.show:
                id: main_page
