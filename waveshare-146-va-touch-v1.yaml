# GLOBALS → phase tracking + init flag + IDs for phases
# -----------------------------------------------------
globals:
  - id: init_in_progress
    type: bool
    restore_value: "false"
    initial_value: "true"
  - id: g_ota_in_progress
    type: bool
    restore_value: false
    initial_value: "false"
  # True only during listening
  - id: va_listening_glow
    type: bool
    restore_value: no
    initial_value: 'false'

  # Direction for ping‑pong (1 forward, -1 backward)
  - id: va_color_dir
    type: int
    restore_value: no
    initial_value: '1'

  # The current color to apply (0xRRGGBB)
  - id: va_color_hex
    type: int
    restore_value: no
    initial_value: '0xFF0000'  # start at red

  - id: timer_progress_text_str
    type: std::string
    restore_value: no
    initial_value: ""


  # voice assistant Phase IDs
  - id: voice_assist_idle_phase_id
    type: int
    initial_value: "1"
  - id: voice_assist_listening_phase_id
    type: int
    initial_value: "2"
  - id: voice_assist_thinking_phase_id
    type: int
    initial_value: "3"
  - id: voice_assist_replying_phase_id
    type: int
    initial_value: "4"
  - id: voice_assist_not_ready_phase_id
    type: int
    initial_value: "10"
  - id: voice_assist_error_phase_id
    type: int
    initial_value: "11"
  - id: voice_assist_muted_phase_id
    type: int
    initial_value: "12"
  - id: voice_assist_timer_finished_phase_id
    type: int
    initial_value: "20"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: "10"

  - id: last_active_ms
    type: int
    restore_value: false
    initial_value: "0"

  - id: timer_progress_percent
    type: int
    restore_value: yes
    initial_value: "0"

  - id: timer_progress_has_timer
    type: bool
    #set to restore timer on reboot
    restore_value: yes
    initial_value: "false"

  - id: timer_progress_seconds_left
    type: int
    restore_value: yes
    initial_value: "0"

  - id: va_blink_on
    type: bool
    initial_value: "false"

